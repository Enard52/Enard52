name: Update Live Profile Stats

on:
  schedule:
    - cron: '0 */6 * * *' # Every 6 hours
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Stats & Update README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          USER_DATA=$(curl -s -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/users/Enard52)
          FOLLOWERS=$(echo "$USER_DATA" | jq -r '.followers')
          REPOS=$(echo "$USER_DATA" | jq -r '.public_repos')

          if [ "$FOLLOWERS" != "null" ] && [ -n "$FOLLOWERS" ] && [ "$REPOS" != "null" ] && [ -n "$REPOS" ]; then
            sed -i -E "s|img.shields.io/badge/Followers-[0-9]+|img.shields.io/badge/Followers-$FOLLOWERS|g" README.md
            sed -i -E "s|img.shields.io/badge/Repositories-[0-9]+|img.shields.io/badge/Repositories-$REPOS|g" README.md

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git diff --staged --quiet || (git commit -m "chore: update live followers and repo count [skip ci]" && git push)
          fi
